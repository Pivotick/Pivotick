<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot / enrichment prototype — Pivotick</title>
</head>
<body>
  <div id="shell">
    <div id="app"></div>

    <aside id="harness">
      <header class="harness-head">
        <span class="harness-title">Provider call log</span>
        <span id="call-log-count" class="harness-count">0 calls</span>
        <button id="clear-log" class="harness-btn">Clear</button>
      </header>

      <div class="harness-controls">
        <label class="harness-control">
          <span>Latency</span>
          <input id="latency" type="range" min="0" max="3000" step="100" value="650">
          <output id="latency-value">650 ms</output>
        </label>
        <label class="harness-control harness-check">
          <input id="fail-next" type="checkbox">
          <span>Fail the next call</span>
        </label>
      </div>

      <div id="call-log" class="harness-log"></div>

      <footer class="harness-foot">
        Enter <b>Pivot</b> mode (P) to start. Selecting nodes with the mode closed fires nothing —
        that is D11, and this log is the proof.
      </footer>
    </aside>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>

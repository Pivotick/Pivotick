name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24 # npm 11.5.1+, which trusted publishing needs
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(npm pkg get version | tr -d '"')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Package dist
        run: |
          cd dist
          zip -r ../pivotick-dist.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pivotick-dist.zip

      # Last: publishing a version cannot be undone, so everything that can be
      # re-run on a failed release runs before it.
      #
      # No token — npm trades this job's OIDC identity for a short-lived
      # credential and attaches provenance itself. The trusted publisher is
      # registered on npmjs.com against this file's name, so renaming it breaks
      # the release until the publisher is registered again.
      - name: Publish to npm
        run: npm publish
